id = "abroller666.display-panes"
name = "Display Panes"
version = "0.2.2"
min_herdr_version = "0.9.2"
description = "tmux display-panes for Herdr: label every pane in the current tab and jump with one key"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Display panes"
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin abroller666.display-panes --entrypoint picker"]

[[panes]]
id = "picker"
title = "Display panes"
placement = "popup"
width = "80%"
height = "80%"
command = ["python3", "display_panes.py"]
